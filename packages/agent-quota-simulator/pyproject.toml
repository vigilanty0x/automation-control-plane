[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="agent-quota-simulator"
version="0.1.0"
description="Deterministic agent quota admission simulator"
readme="README.md"
requires-python=">=3.11"
license={text="Apache-2.0"}
dependencies=[]
[project.scripts]
agent-quota-simulator="agent_quota_simulator:main"
[tool.setuptools]
package-dir={""="src"}
[tool.setuptools.packages.find]
where=["src"]
