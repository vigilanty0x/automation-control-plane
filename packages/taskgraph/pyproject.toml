[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskgraph-agents"
version = "0.1.0"
description = "Durable DAG scheduling for agent tasks with retries, resume, ownership, and evidence gates."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "vigilanty0x"}]
dependencies = []

[project.scripts]
taskgraph = "taskgraph.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

