name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python scripts/check.py
      - run: python -m unittest discover -s tests -v
      - run: agent-handoff validate --input examples/handoff.json
      - run: agent-handoff probe --level functional
      - run: agent-handoff render --input examples/handoff.json --format markdown
      - run: python -m pip wheel . --no-deps --wheel-dir dist

