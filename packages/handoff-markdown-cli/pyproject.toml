[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="handoff-markdown-cli"
version="0.1.0"
description="Evidence-complete Markdown handoff generator"
readme="README.md"
requires-python=">=3.11"
license={text="Apache-2.0"}
dependencies=[]
[project.scripts]
handoff-md="handoff_markdown_cli:main"
[tool.setuptools]
package-dir={""="src"}
[tool.setuptools.packages.find]
where=["src"]
