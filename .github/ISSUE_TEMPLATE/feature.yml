name: Feature proposal
description: Propose a bounded capability with explicit non-goals.
title: "[proposal] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Privacy and safety boundary
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Acceptance proof and abandonment criterion
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
    validations:
      required: true
