name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: |
          python -m pip install --disable-pip-version-check "build==1.2.2.post1"
          python -m build --no-isolation
      - name: Install wheel
        run: python -m pip install --disable-pip-version-check --force-reinstall --no-deps dist/*.whl
      - name: Unit and adversarial tests
        run: python -m unittest discover -s tests -v
      - name: Public-boundary checks
        run: python scripts/check.py
      - name: Module example smoke
        run: python -m automation_control_plane.cli examples/basic.json
      - name: Installed CLI smoke
        run: automation-control-plane examples/basic.json

