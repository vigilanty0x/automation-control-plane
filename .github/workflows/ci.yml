name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: "315532800"

jobs:
  candidate:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned A03 build toolchain
        run: |
          python -m pip install --disable-pip-version-check --upgrade -r requirements-build-a03.txt
      - name: Run complete A03 candidate gate
        env:
          MODEL_ROUTER_TESTS_VERIFIED: "1"
          MODEL_ROUTER_COUNTERPROOF_VERIFIED: "1"
        run: |
          python scripts/a03_ci_candidate.py
      - name: Upload A03 candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: model-router-a03-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            release-evidence-a03/SHA256SUMS.txt
            release-evidence-a03/model-router.cdx.json
            release-evidence-a03/RELEASE_EVIDENCE.json
          if-no-files-found: error
          retention-days: 14
