name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile modules
        run: python -m compileall -q src
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  wheel:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check build==1.2.2.post1
      - run: python -m build --wheel
      - name: Install wheel outside checkout
        run: >-
          python -c "import glob,subprocess,sys;
          wheels=glob.glob('dist/*.whl'); assert len(wheels)==1, wheels;
          subprocess.check_call([sys.executable,'-m','pip','install','--disable-pip-version-check','--force-reinstall','--no-deps',wheels[0]])"
      - name: Test installed wheel outside checkout
        working-directory: ${{ runner.temp }}
        run: python -m unittest discover -s "${{ github.workspace }}/tests" -v
      - name: Smoke installed commands outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          apprentice --data-dir apprentice-smoke version
          apprentice --data-dir apprentice-smoke capabilities
          apprentice --data-dir apprentice-smoke demo --output reference.learnpack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apprentice-ai-wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check build==1.2.2.post1
      - run: python -m build --sdist
      - name: Rebuild wheel from sdist
        shell: bash
        run: |
          mkdir "${RUNNER_TEMP}/sdist-source"
          tar -xzf dist/*.tar.gz -C "${RUNNER_TEMP}/sdist-source" --strip-components=1
          cd "${RUNNER_TEMP}/sdist-source"
          python -m build --wheel
      - name: Install wheel rebuilt from sdist
        run: >-
          python -c "import glob,subprocess,sys;
          wheels=glob.glob('${{ runner.temp }}/sdist-source/dist/*.whl'); assert len(wheels)==1, wheels;
          subprocess.check_call([sys.executable,'-m','pip','install','--disable-pip-version-check','--force-reinstall','--no-deps',wheels[0]])"
      - name: Smoke sdist-derived installation outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          apprentice --data-dir apprentice-sdist-smoke version
          apprentice --data-dir apprentice-sdist-smoke capabilities
          apprentice --data-dir apprentice-sdist-smoke demo --output sdist-reference.learnpack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apprentice-ai-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
