name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build sdist and wheel with the exact reviewed toolchain
        run: |
          python -m pip install --disable-pip-version-check "build==1.2.2.post1" "setuptools==83.0.0" "wheel==0.45.1"
          python -m build --no-isolation
      - name: Install wheel
        run: |
          python -m pip install --disable-pip-version-check --force-reinstall --no-deps dist/*.whl
          python -m pip check
      - name: Sdist and wheel clean-environment parity
        shell: bash
        run: |
          set -euo pipefail
          wheel_env="$RUNNER_TEMP/wheel-venv"
          sdist_env="$RUNNER_TEMP/sdist-venv"
          python -m venv "$wheel_env"
          python -m venv "$sdist_env"
          "$wheel_env/bin/python" -m pip install --disable-pip-version-check --no-deps dist/*.whl
          "$sdist_env/bin/python" -m pip install --disable-pip-version-check --no-deps dist/*.tar.gz
          "$wheel_env/bin/python" -m pip check
          "$sdist_env/bin/python" -m pip check
          "$wheel_env/bin/python" -c 'import automation_control_plane as package; print(package.__version__)' > "$RUNNER_TEMP/wheel-version.txt"
          "$sdist_env/bin/python" -c 'import automation_control_plane as package; print(package.__version__)' > "$RUNNER_TEMP/sdist-version.txt"
          "$wheel_env/bin/automation-control-plane" examples/basic.json > "$RUNNER_TEMP/wheel-smoke.json"
          "$sdist_env/bin/automation-control-plane" examples/basic.json > "$RUNNER_TEMP/sdist-smoke.json"
          "$wheel_env/bin/agentops" inventory > "$RUNNER_TEMP/wheel-agentops.json"
          "$sdist_env/bin/agentops" inventory > "$RUNNER_TEMP/sdist-agentops.json"
          "$wheel_env/bin/agentops" compatibility > "$RUNNER_TEMP/wheel-compatibility.json"
          "$sdist_env/bin/agentops" compatibility > "$RUNNER_TEMP/sdist-compatibility.json"
          "$wheel_env/bin/agentops" consumers --input examples/agentops/consumers.json > "$RUNNER_TEMP/wheel-consumers.json"
          "$sdist_env/bin/agentops" consumers --input examples/agentops/consumers.json > "$RUNNER_TEMP/sdist-consumers.json"
          "$wheel_env/bin/agentops" rollback --input examples/agentops/rollback.json > "$RUNNER_TEMP/wheel-rollback.json"
          "$sdist_env/bin/agentops" rollback --input examples/agentops/rollback.json > "$RUNNER_TEMP/sdist-rollback.json"
          diff -u "$RUNNER_TEMP/wheel-version.txt" "$RUNNER_TEMP/sdist-version.txt"
          diff -u "$RUNNER_TEMP/wheel-smoke.json" "$RUNNER_TEMP/sdist-smoke.json"
          diff -u "$RUNNER_TEMP/wheel-agentops.json" "$RUNNER_TEMP/sdist-agentops.json"
          diff -u "$RUNNER_TEMP/wheel-compatibility.json" "$RUNNER_TEMP/sdist-compatibility.json"
          diff -u "$RUNNER_TEMP/wheel-consumers.json" "$RUNNER_TEMP/sdist-consumers.json"
          diff -u "$RUNNER_TEMP/wheel-rollback.json" "$RUNNER_TEMP/sdist-rollback.json"
      - name: Unit and adversarial tests
        run: python -m unittest discover -s tests -v
      - name: Checkout exact agentmesh source evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/agentmesh
          ref: 320f5116f6582519d1609ce87287fd9ff7267eb3
          path: .compat/agentmesh
          persist-credentials: false
      - name: Checkout exact context-window-budgeter source evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/context-window-budgeter
          ref: 35bb3e05d05ad870715b740143c429f08eda25e7
          path: .compat/context-window-budgeter
          persist-credentials: false
      - name: Checkout exact agent-quota-simulator source evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/agent-quota-simulator
          ref: e99000cecf12432365e8ccfc8fa6e4b1d18ad15f
          path: .compat/agent-quota-simulator
          persist-credentials: false
      - name: Checkout exact agent-session-recorder source evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/agent-session-recorder
          ref: 2363c4efe0c61158c523a6dfc3d29cb3d7af1c54
          path: .compat/agent-session-recorder
          persist-credentials: false
      - name: Checkout exact circuit-breaker-lab source evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/circuit-breaker-lab
          ref: 2924dfb6eed8a208788491fa1d50fa6bd99e4359
          path: .compat/circuit-breaker-lab
          persist-credentials: false
      - name: Checkout exact agent-inbox source evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/agent-inbox
          ref: 748f237659f98a2a49478aa58913e71e59a03433
          path: .compat/agent-inbox
          persist-credentials: false
      - name: Run SHA-bound source compatibility counter-proofs
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/agentops_compat_probe.py \
            --agentmesh-root .compat/agentmesh \
            --context-root .compat/context-window-budgeter \
            --quota-root .compat/agent-quota-simulator \
            --session-root .compat/agent-session-recorder \
            --circuit-root .compat/circuit-breaker-lab \
            --inbox-root .compat/agent-inbox \
            --output agentops-compatibility-evidence.json
          cat agentops-compatibility-evidence.json
      - name: Upload AgentOps compatibility evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentops-compatibility-evidence-py${{ matrix.python-version }}-${{ github.run_id }}
          path: agentops-compatibility-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove external source checkouts before repository boundary scan
        run: rm -rf .compat
      - name: Bytecode compile check
        run: python -m compileall -q src tests
      - name: Public-boundary checks
        run: python scripts/check.py
      - name: Durable module example smoke
        run: python -m automation_control_plane.cli examples/basic.json
      - name: Durable installed CLI smoke
        run: automation-control-plane examples/basic.json
      - name: Durable CLI help smoke
        run: automation-control-plane --help
      - name: AgentOps module smoke
        run: python -m automation_control_plane.agentops inventory
      - name: Installed AgentOps CLI examples
        run: |
          agentops inventory
          agentops compatibility
          agentops route --input examples/agentops/routing.json
          agentops context --input examples/agentops/context.json
          agentops quota --input examples/agentops/quota.json
          agentops session-record --input examples/agentops/session.json
          agentops circuit --input examples/agentops/circuit.json
          agentops inbox --input examples/agentops/inbox.json
          agentops consumers --input examples/agentops/consumers.json
          agentops rollback --input examples/agentops/rollback.json
