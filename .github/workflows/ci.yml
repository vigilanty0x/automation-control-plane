name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: "315532800"

jobs:
  candidate:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned A03 build toolchain
        run: |
          python -m pip install --disable-pip-version-check --upgrade -r requirements-build-a03.txt
      - name: Run complete A03 candidate gate
        env:
          MODEL_ROUTER_TESTS_VERIFIED: "1"
          MODEL_ROUTER_COUNTERPROOF_VERIFIED: "1"
        run: |
          python scripts/a03_ci_candidate.py
      - name: Upload A03 candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: model-router-a03-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            release-evidence-a03/SHA256SUMS.txt
            release-evidence-a03/model-router.cdx.json
            release-evidence-a03/RELEASE_EVIDENCE.json
          if-no-files-found: error
          retention-days: 14

  attest-candidate:
    needs: [candidate]
    if: ${{ github.event_name == 'pull_request' && github.actor == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download canonical candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: model-router-a03-ubuntu-latest-py3.11
          path: /tmp/model-router-download
          digest-mismatch: error
      - name: Normalize candidate wheel
        shell: bash
        run: |
          mkdir -p /tmp/model-router-candidate
          wheel="$(find /tmp/model-router-download -type f -name '*.whl' -print)"
          test "$(printf '%s\n' "$wheel" | grep -c .)" -eq 1
          cp "$wheel" /tmp/model-router-candidate/
      - name: Generate signed SLSA provenance
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: /tmp/model-router-candidate/*.whl
      - name: Strictly verify provenance
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          wheel="$(find /tmp/model-router-candidate -maxdepth 1 -name '*.whl' -print -quit)"
          test -s "$BUNDLE_PATH"
          gh attestation verify "$wheel" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$BUNDLE_PATH" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners >/dev/null
      - name: Write attestation receipt
        shell: bash
        env:
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          value = {
              "schema_version": "1.0",
              "product": "Model Router",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_ref": os.environ["GITHUB_REF"],
              "source_digest": os.environ["GITHUB_SHA"],
              "attestation_id": os.environ.get("ATTESTATION_ID"),
              "attestation_url": os.environ.get("ATTESTATION_URL"),
              "verified_with_gh_cli": True,
              "publication_authorized": False,
          }
          Path('/tmp/model-router-candidate/ATTESTATION-RECEIPT.json').write_text(
              json.dumps(value, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Upload signed evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: model-router-a03-provenance-${{ github.run_id }}
          path: |
            ${{ steps.attest.outputs.bundle-path }}
            /tmp/model-router-candidate/*.whl
            /tmp/model-router-candidate/ATTESTATION-RECEIPT.json
          if-no-files-found: error
          retention-days: 30
