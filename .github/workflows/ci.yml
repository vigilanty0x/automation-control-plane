name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: |
          python -m pip install --disable-pip-version-check "build==1.2.2.post1" "setuptools==80.9.0" "wheel==0.45.1"
          python -m build --no-isolation
      - name: Install wheel
        run: python -m pip install --disable-pip-version-check --force-reinstall --no-deps dist/*.whl
      - name: Unit and adversarial tests
        run: python -m unittest discover -s tests -v
      - name: Bytecode compile check
        run: python -m compileall -q src tests
      - name: Public-boundary checks
        run: python scripts/check.py
      - name: Module example smoke
        run: python -m automation_control_plane.cli examples/basic.json
      - name: Installed CLI smoke
        run: automation-control-plane examples/basic.json
      - name: Durable CLI help smoke
        run: automation-control-plane --help
