name: AgentOps public consumer preflight

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/agentops-consumer-preflight.yml"
      - "scripts/agentops_consumer_scan.py"
      - "scripts/agentops_consumer_triage.py"
      - "src/automation_control_plane/agentops/consumers.py"
      - "src/automation_control_plane/agentops/migration_plan.py"
      - "docs/AGENTOPS_SOURCE_INVENTORY.json"
      - "docs/AGENTOPS_PILOT_MANIFEST_TEMPLATE.json"
  pull_request:
    paths:
      - ".github/workflows/agentops-consumer-preflight.yml"
      - "scripts/agentops_consumer_scan.py"
      - "scripts/agentops_consumer_triage.py"
      - "src/automation_control_plane/agentops/consumers.py"
      - "src/automation_control_plane/agentops/migration_plan.py"
      - "docs/AGENTOPS_SOURCE_INVENTORY.json"
      - "docs/AGENTOPS_PILOT_MANIFEST_TEMPLATE.json"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Collect read-only public preflight evidence
        id: scan
        continue-on-error: true
        env:
          GH_PUBLIC_EVIDENCE_AUTH: ${{ github.token }}
          PUBLIC_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p agentops-consumer-preflight
          set +e
          PYTHONPATH=src python scripts/agentops_consumer_scan.py \
            --owner "$PUBLIC_OWNER" \
            --auth-env GH_PUBLIC_EVIDENCE_AUTH \
            --source-inventory docs/AGENTOPS_SOURCE_INVENTORY.json \
            --inventory-output agentops-consumer-preflight/inventory.json \
            --receipt-output agentops-consumer-preflight/receipt.json \
            --report-output agentops-consumer-preflight/report.md
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Triage coarse code-file import candidates
        id: triage
        if: always()
        continue-on-error: true
        env:
          GH_PUBLIC_EVIDENCE_AUTH: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f agentops-consumer-preflight/inventory.json ]]; then
            echo '{"status":"blocked","reason":"inventory missing"}' | tee agentops-consumer-preflight/triage-summary.json
            exit 2
          fi
          set +e
          PYTHONPATH=src python scripts/agentops_consumer_triage.py \
            --inventory agentops-consumer-preflight/inventory.json \
            --output agentops-consumer-preflight/triage.json \
            --auth-env GH_PUBLIC_EVIDENCE_AUTH \
            | tee agentops-consumer-preflight/triage-summary.json
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Derive fail-closed migration plan
        id: plan
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f agentops-consumer-preflight/inventory.json || ! -f agentops-consumer-preflight/triage.json ]]; then
            echo '{"status":"blocked","reason":"inventory or triage missing"}' | tee agentops-consumer-preflight/migration-plan-summary.json
            exit 2
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("agentops-consumer-preflight")
          payload = {
              "consumer_inventory": json.loads((root / "inventory.json").read_text(encoding="utf-8")),
              "triage": json.loads((root / "triage.json").read_text(encoding="utf-8")),
          }
          (root / "migration-plan-input.json").write_text(
              json.dumps(payload, sort_keys=True, separators=(",", ":"), ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          set +e
          PYTHONPATH=src python -m automation_control_plane.agentops migration-plan \
            --input agentops-consumer-preflight/migration-plan-input.json \
            > agentops-consumer-preflight/migration-plan.json
          code=$?
          set -e
          python - <<'PY' | tee agentops-consumer-preflight/migration-plan-summary.json
          import json
          from pathlib import Path
          result = json.loads(Path("agentops-consumer-preflight/migration-plan.json").read_text(encoding="utf-8"))
          details = result.get("details", {})
          print(json.dumps({
              "status": result.get("status"),
              "formal_migration_gate": details.get("formal_migration_gate"),
              "adapter_candidates": details.get("adapter_candidates", []),
              "observed_runtime_reference_count": details.get("observed_runtime_reference_count"),
              "pilot_coverage_complete": details.get("pilot_coverage_complete"),
              "planning_evidence_ready": details.get("planning_evidence_ready"),
              "migration_performed": details.get("migration_performed"),
          }, sort_keys=True, separators=(",", ":")))
          PY
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Publish preflight report
        if: always()
        shell: bash
        run: |
          printf '%s\n' '## PRE-FLIGHT ONLY' '' 'This branch-run scan is read-only discovery. It cannot open the migration gate, activate aliases, redirect consumers, release, or archive sources.' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f agentops-consumer-preflight/report.md ]]; then
            cat agentops-consumer-preflight/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' '' 'Collector did not produce a report.' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '%s\n' '' '## Code-reference triage' '' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f agentops-consumer-preflight/triage-summary.json ]]; then
            printf '%s\n' '```json' >> "$GITHUB_STEP_SUMMARY"
            cat agentops-consumer-preflight/triage-summary.json >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' '```' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'Triage did not produce a summary.' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '%s\n' '' '## Fail-closed migration plan' '' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f agentops-consumer-preflight/migration-plan-summary.json ]]; then
            printf '%s\n' '```json' >> "$GITHUB_STEP_SUMMARY"
            cat agentops-consumer-preflight/migration-plan-summary.json >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' '```' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'Migration planner did not produce a summary.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload bounded preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentops-public-consumer-preflight-${{ github.run_id }}
          path: agentops-consumer-preflight/
          if-no-files-found: warn
          retention-days: 30
      - name: Keep migration gate closed
        if: always()
        shell: bash
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
          TRIAGE_OUTCOME: ${{ steps.triage.outcome }}
          TRIAGE_EXIT_CODE: ${{ steps.triage.outputs.exit_code }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          PLAN_EXIT_CODE: ${{ steps.plan.outputs.exit_code }}
        run: |
          echo "preflight scan outcome=$SCAN_OUTCOME exit_code=${SCAN_EXIT_CODE:-unknown}"
          echo "triage outcome=$TRIAGE_OUTCOME exit_code=${TRIAGE_EXIT_CODE:-unknown}"
          echo "plan outcome=$PLAN_OUTCOME exit_code=${PLAN_EXIT_CODE:-unknown}"
          echo "No migration authorization is produced by this workflow."
          exit 0
