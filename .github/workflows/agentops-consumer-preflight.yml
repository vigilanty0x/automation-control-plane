name: AgentOps public consumer preflight

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Collect read-only public preflight evidence
        id: scan
        continue-on-error: true
        env:
          GH_PUBLIC_EVIDENCE_AUTH: ${{ github.token }}
          PUBLIC_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p agentops-consumer-preflight
          set +e
          PYTHONPATH=src python scripts/agentops_consumer_scan.py \
            --owner "$PUBLIC_OWNER" \
            --auth-env GH_PUBLIC_EVIDENCE_AUTH \
            --source-inventory docs/AGENTOPS_SOURCE_INVENTORY.json \
            --inventory-output agentops-consumer-preflight/inventory.json \
            --receipt-output agentops-consumer-preflight/receipt.json \
            --report-output agentops-consumer-preflight/report.md
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Publish preflight report
        if: always()
        shell: bash
        run: |
          printf '%s\n' '## PRE-FLIGHT ONLY' '' 'This branch-run scan is read-only discovery. It cannot open the migration gate, activate aliases, redirect consumers, release, or archive sources.' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f agentops-consumer-preflight/report.md ]]; then
            cat agentops-consumer-preflight/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' '' 'Collector did not produce a report.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload bounded preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentops-public-consumer-preflight-${{ github.run_id }}
          path: agentops-consumer-preflight/
          if-no-files-found: warn
          retention-days: 30
      - name: Keep migration gate closed
        if: always()
        shell: bash
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        run: |
          echo "preflight scan outcome=$SCAN_OUTCOME exit_code=${SCAN_EXIT_CODE:-unknown}"
          echo "No migration authorization is produced by this workflow."
          exit 0
