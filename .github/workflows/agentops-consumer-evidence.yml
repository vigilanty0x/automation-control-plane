name: AgentOps public consumer evidence

on:
  workflow_dispatch:
    inputs:
      pilot_manifest_json:
        description: Human-reviewed pilot/adopter completeness manifest JSON required for a passing formal run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: agentops-public-consumer-evidence
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require reviewed default-branch lineage
        env:
          CURRENT_REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          echo "candidate ref=$CURRENT_REF default branch=$DEFAULT_BRANCH"
          if [[ "$CURRENT_REF" != "$DEFAULT_BRANCH" ]]; then
            echo "Formal AgentOps evidence must run from the repository default branch." >&2
            exit 2
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Collect public-only consumer evidence
        id: scan
        continue-on-error: true
        env:
          GH_PUBLIC_EVIDENCE_AUTH: ${{ github.token }}
          PUBLIC_PILOT_MANIFEST: ${{ inputs.pilot_manifest_json }}
          PUBLIC_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p agentops-consumer-evidence
          set +e
          PYTHONPATH=src python scripts/agentops_consumer_scan.py \
            --owner "$PUBLIC_OWNER" \
            --auth-env GH_PUBLIC_EVIDENCE_AUTH \
            --source-inventory docs/AGENTOPS_SOURCE_INVENTORY.json \
            --pilot-manifest-env PUBLIC_PILOT_MANIFEST \
            --inventory-output agentops-consumer-evidence/inventory.json \
            --receipt-output agentops-consumer-evidence/receipt.json \
            --report-output agentops-consumer-evidence/report.md
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Triage coarse code-file import candidates
        id: triage
        if: always()
        continue-on-error: true
        env:
          GH_PUBLIC_EVIDENCE_AUTH: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f agentops-consumer-evidence/inventory.json ]]; then
            echo '{"status":"blocked","reason":"inventory missing"}' | tee agentops-consumer-evidence/triage-summary.json
            exit 2
          fi
          set +e
          PYTHONPATH=src python scripts/agentops_consumer_triage.py \
            --inventory agentops-consumer-evidence/inventory.json \
            --output agentops-consumer-evidence/triage.json \
            --auth-env GH_PUBLIC_EVIDENCE_AUTH \
            | tee agentops-consumer-evidence/triage-summary.json
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Derive candidate-bound fail-closed migration plan
        id: plan
        if: always()
        continue-on-error: true
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f agentops-consumer-evidence/inventory.json || ! -f agentops-consumer-evidence/triage.json ]]; then
            echo '{"status":"blocked","reason":"inventory or triage missing"}' | tee agentops-consumer-evidence/migration-plan-summary.json
            exit 2
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path("agentops-consumer-evidence")
          payload = {
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "consumer_inventory": json.loads((root / "inventory.json").read_text(encoding="utf-8")),
              "triage": json.loads((root / "triage.json").read_text(encoding="utf-8")),
          }
          (root / "migration-plan-input.json").write_text(
              json.dumps(payload, sort_keys=True, separators=(",", ":"), ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          set +e
          PYTHONPATH=src python -m automation_control_plane.agentops migration-plan \
            --input agentops-consumer-evidence/migration-plan-input.json \
            > agentops-consumer-evidence/migration-plan.json
          code=$?
          set -e
          python - <<'PY' | tee agentops-consumer-evidence/migration-plan-summary.json
          import json
          from pathlib import Path
          result = json.loads(Path("agentops-consumer-evidence/migration-plan.json").read_text(encoding="utf-8"))
          details = result.get("details", {})
          print(json.dumps({
              "status": result.get("status"),
              "candidate_sha": details.get("candidate_sha"),
              "formal_migration_gate": details.get("formal_migration_gate"),
              "adapter_candidates": details.get("adapter_candidates", []),
              "observed_runtime_reference_count": details.get("observed_runtime_reference_count"),
              "pilot_coverage_complete": details.get("pilot_coverage_complete"),
              "planning_evidence_ready": details.get("planning_evidence_ready"),
              "migration_performed": details.get("migration_performed"),
          }, sort_keys=True, separators=(",", ":")))
          PY
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Checkout exact agentmesh source evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/agentmesh
          ref: 320f5116f6582519d1609ce87287fd9ff7267eb3
          path: .compat/agentmesh
          persist-credentials: false

      - name: Checkout exact context-window-budgeter source evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/context-window-budgeter
          ref: 35bb3e05d05ad870715b740143c429f08eda25e7
          path: .compat/context-window-budgeter
          persist-credentials: false

      - name: Checkout exact agent-quota-simulator source evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/agent-quota-simulator
          ref: e99000cecf12432365e8ccfc8fa6e4b1d18ad15f
          path: .compat/agent-quota-simulator
          persist-credentials: false

      - name: Checkout exact agent-session-recorder source evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/agent-session-recorder
          ref: 2363c4efe0c61158c523a6dfc3d29cb3d7af1c54
          path: .compat/agent-session-recorder
          persist-credentials: false

      - name: Checkout exact circuit-breaker-lab source evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/circuit-breaker-lab
          ref: 2924dfb6eed8a208788491fa1d50fa6bd99e4359
          path: .compat/circuit-breaker-lab
          persist-credentials: false

      - name: Checkout exact agent-inbox source evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/agent-inbox
          ref: 748f237659f98a2a49478aa58913e71e59a03433
          path: .compat/agent-inbox
          persist-credentials: false

      - name: Run same-candidate compatibility proof
        id: compatibility
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/agentops_compat_probe.py \
            --agentmesh-root .compat/agentmesh \
            --context-root .compat/context-window-budgeter \
            --quota-root .compat/agent-quota-simulator \
            --session-root .compat/agent-session-recorder \
            --circuit-root .compat/circuit-breaker-lab \
            --inbox-root .compat/agent-inbox \
            --output agentops-consumer-evidence/compatibility.json

      - name: Run same-candidate reversible adapter proof
        id: adapters
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/agentops_adapter_compat_probe.py \
            --agentmesh-root .compat/agentmesh \
            --context-root .compat/context-window-budgeter \
            --quota-root .compat/agent-quota-simulator \
            --session-root .compat/agent-session-recorder \
            --circuit-root .compat/circuit-breaker-lab \
            --target-root . \
            --output agentops-consumer-evidence/adapters.json

      - name: Checkout exact agent-budgeter source evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/agent-budgeter
          ref: cfa9c0a8830f3e2e3a11602da590e347f8483d2f
          path: .compat/agent-budgeter
          persist-credentials: false

      - name: Checkout exact agent-retry-kit source evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/agent-retry-kit
          ref: 38f97aaa6796fda6956202aad9086e3e5e8ada9f
          path: .compat/agent-retry-kit
          persist-credentials: false

      - name: Checkout exact human-in-the-loop-queue source evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/human-in-the-loop-queue
          ref: db281bf7ff971a2fd4ca6af9e495b2c0fd6cd30b
          path: .compat/human-in-the-loop-queue
          persist-credentials: false

      - name: Checkout exact idempotency-kit source evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/idempotency-kit
          ref: 80e78a4d9b73aeabb200578c2ecb5090f31a410f
          path: .compat/idempotency-kit
          persist-credentials: false

      - name: Checkout exact taskgraph source evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/taskgraph
          ref: 937abf0d096cb1f6ff48aa09b8dd8a69d9a36c0d
          path: .compat/taskgraph
          persist-credentials: false

      - name: Checkout exact timeout-toolkit source evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/timeout-toolkit
          ref: a2a053e39a6eaa40cde7d81f87ee4838cf562583
          path: .compat/timeout-toolkit
          persist-credentials: false

      - name: Run same-candidate core-dedup proof
        id: core
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/agentops_core_compat_runner.py \
            --budgeter-root .compat/agent-budgeter \
            --retry-root .compat/agent-retry-kit \
            --hitl-root .compat/human-in-the-loop-queue \
            --idempotency-root .compat/idempotency-kit \
            --taskgraph-root .compat/taskgraph \
            --timeout-root .compat/timeout-toolkit \
            --target-root . \
            --output agentops-consumer-evidence/core.json

      - name: Assemble same-candidate technical review packet
        id: packet
        continue-on-error: true
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/agentops_review_packet.py \
            --candidate-sha "$CANDIDATE_SHA" \
            --migration-plan agentops-consumer-evidence/migration-plan.json \
            --compatibility agentops-consumer-evidence/compatibility.json \
            --adapters agentops-consumer-evidence/adapters.json \
            --core agentops-consumer-evidence/core.json \
            --output agentops-consumer-evidence/technical-review-packet.json \
            | tee agentops-consumer-evidence/technical-review-packet-summary.json

      - name: Publish bounded report to the job summary
        if: always()
        shell: bash
        run: |
          if [[ -f agentops-consumer-evidence/report.md ]]; then
            cat agentops-consumer-evidence/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' '## AgentOps public consumer evidence' '' 'Collector did not produce a report.' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '%s\n' '' '## Code-reference triage' '' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f agentops-consumer-evidence/triage-summary.json ]]; then
            printf '%s\n' '```json' >> "$GITHUB_STEP_SUMMARY"
            cat agentops-consumer-evidence/triage-summary.json >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '%s\n' '' '## Candidate-bound migration plan' '' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f agentops-consumer-evidence/migration-plan-summary.json ]]; then
            printf '%s\n' '```json' >> "$GITHUB_STEP_SUMMARY"
            cat agentops-consumer-evidence/migration-plan-summary.json >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '%s\n' '' '## Same-candidate technical review packet' '' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f agentops-consumer-evidence/technical-review-packet-summary.json ]]; then
            printf '%s\n' '```json' >> "$GITHUB_STEP_SUMMARY"
            cat agentops-consumer-evidence/technical-review-packet-summary.json >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentops-public-consumer-evidence-${{ github.run_id }}
          path: agentops-consumer-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve fail-closed formal evidence result
        if: always()
        shell: bash
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
          TRIAGE_OUTCOME: ${{ steps.triage.outcome }}
          TRIAGE_EXIT_CODE: ${{ steps.triage.outputs.exit_code }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          PLAN_EXIT_CODE: ${{ steps.plan.outputs.exit_code }}
          COMPATIBILITY_OUTCOME: ${{ steps.compatibility.outcome }}
          ADAPTER_OUTCOME: ${{ steps.adapters.outcome }}
          CORE_OUTCOME: ${{ steps.core.outcome }}
          PACKET_OUTCOME: ${{ steps.packet.outcome }}
        run: |
          set -euo pipefail
          echo "scan outcome=$SCAN_OUTCOME exit_code=${SCAN_EXIT_CODE:-unknown}"
          echo "triage outcome=$TRIAGE_OUTCOME exit_code=${TRIAGE_EXIT_CODE:-unknown}"
          echo "plan outcome=$PLAN_OUTCOME exit_code=${PLAN_EXIT_CODE:-unknown}"
          echo "compatibility outcome=$COMPATIBILITY_OUTCOME"
          echo "adapter outcome=$ADAPTER_OUTCOME"
          echo "core outcome=$CORE_OUTCOME"
          echo "packet outcome=$PACKET_OUTCOME"
          if [[ "$SCAN_OUTCOME" != "success" || "$SCAN_EXIT_CODE" != "0" ]]; then
            echo "Consumer evidence is incomplete or blocked; no migration gate is opened." >&2
            exit 1
          fi
          if [[ "$TRIAGE_OUTCOME" != "success" || "$TRIAGE_EXIT_CODE" != "0" ]]; then
            echo "Code-reference triage is incomplete or blocked; no migration gate is opened." >&2
            exit 1
          fi
          if [[ "$PLAN_OUTCOME" != "success" || "$PLAN_EXIT_CODE" != "0" ]]; then
            echo "Migration planning evidence is incomplete or blocked; no migration gate is opened." >&2
            exit 1
          fi
          for outcome in "$COMPATIBILITY_OUTCOME" "$ADAPTER_OUTCOME" "$CORE_OUTCOME" "$PACKET_OUTCOME"; do
            if [[ "$outcome" != "success" ]]; then
              echo "Same-candidate technical evidence is incomplete; no migration gate is opened." >&2
              exit 1
            fi
          done
          echo "Formal evidence packet is complete for candidate $GITHUB_SHA on the default branch."
          echo "No alias, consumer mutation, migration, release, retirement, or archive authorization is produced."
