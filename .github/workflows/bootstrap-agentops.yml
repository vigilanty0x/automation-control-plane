name: Temporary AgentOps rehearsal assembly

permissions:
  contents: write

on:
  push:
    branches:
      - audit/agentops-rehearsal-v1-20260818
  pull_request:
    branches:
      - agent/secure-setuptools-build

concurrency:
  group: agentops-rehearsal-assembly
  cancel-in-progress: false

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: audit/agentops-rehearsal-v1-20260818
      - name: Assemble integrity-bound AgentOps sources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          from base64 import b64decode
          from hashlib import sha256
          from io import BytesIO
          import json
          from pathlib import Path, PurePosixPath
          import shutil
          import tarfile

          root = Path.cwd().resolve()
          bootstrap = root / ".bootstrap-agentops"
          manifest = json.loads((bootstrap / "manifest.json").read_text(encoding="utf-8"))
          parts = sorted(bootstrap.glob("archive.part-*.b64"))
          if not parts:
              raise SystemExit("missing archive chunks")
          encoded = "".join(part.read_text(encoding="ascii").strip() for part in parts)
          try:
              archive = b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit("invalid base64 archive chunks") from exc
          if manifest.get("schemaVersion") != 1:
              raise SystemExit("unsupported bootstrap manifest")
          if len(archive) != manifest.get("archiveBytes"):
              raise SystemExit("archive byte count mismatch")
          if sha256(archive).hexdigest() != manifest.get("archiveSha256"):
              raise SystemExit("archive SHA-256 mismatch")

          expected = {entry["path"]: entry for entry in manifest.get("files", [])}
          if not expected or len(expected) != len(manifest.get("files", [])):
              raise SystemExit("invalid or duplicate manifest paths")

          with tarfile.open(fileobj=BytesIO(archive), mode="r:gz") as package:
              members = package.getmembers()
              names = [member.name for member in members]
              if set(names) != set(expected) or len(names) != len(expected):
                  raise SystemExit("archive membership mismatch")
              for member in members:
                  relative = PurePosixPath(member.name)
                  if (
                      not member.isfile()
                      or relative.is_absolute()
                      or ".." in relative.parts
                      or not relative.parts
                  ):
                      raise SystemExit(f"unsafe archive member: {member.name}")
                  extracted = package.extractfile(member)
                  if extracted is None:
                      raise SystemExit(f"missing archive data: {member.name}")
                  data = extracted.read()
                  metadata = expected[member.name]
                  if len(data) != metadata["bytes"]:
                      raise SystemExit(f"file byte count mismatch: {member.name}")
                  if sha256(data).hexdigest() != metadata["sha256"]:
                      raise SystemExit(f"file SHA-256 mismatch: {member.name}")
                  destination = root.joinpath(*relative.parts).resolve()
                  if root not in destination.parents:
                      raise SystemExit(f"path escapes repository: {member.name}")
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(data)

          shutil.rmtree(bootstrap)
          (root / ".github" / "workflows" / "bootstrap-agentops.yml").unlink()
          PY
      - name: Run AgentOps and repository counter-proofs
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests scripts
          PYTHONPATH=src python -m unittest discover -s tests -v
          PYTHONPATH=src python scripts/check.py
          PYTHONPATH=src python -m automation_control_plane.agentops inventory
          PYTHONPATH=src python -m automation_control_plane.agentops route --input examples/agentops/routing.json
          PYTHONPATH=src python -m automation_control_plane.agentops context --input examples/agentops/context.json
          PYTHONPATH=src python -m automation_control_plane.agentops quota --input examples/agentops/quota.json
          PYTHONPATH=src python -m automation_control_plane.agentops session-record --input examples/agentops/session.json
          PYTHONPATH=src python -m automation_control_plane.agentops circuit --input examples/agentops/circuit.json
          PYTHONPATH=src python -m automation_control_plane.agentops inbox --input examples/agentops/inbox.json
      - name: Commit the reviewed rehearsal tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: add bounded AgentOps contract rehearsal"
          git push origin "HEAD:audit/agentops-rehearsal-v1-20260818"
