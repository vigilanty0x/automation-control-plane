name: Temporary build backend range normalization

permissions:
  contents: write

on:
  push:
    branches:
      - agent/secure-setuptools-build
  pull_request:
    branches:
      - main

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: agent/secure-setuptools-build
      - name: Replace the fragile exact backend pin with an audited range
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          project = Path("pyproject.toml")
          project_text = project.read_text(encoding="utf-8")
          old_project = 'requires = ["setuptools==83.0.0"]'
          new_project = 'requires = ["setuptools>=83.0.0,<84"]'
          if old_project not in project_text:
              raise SystemExit("expected exact setuptools pin was not found")
          project.write_text(project_text.replace(old_project, new_project, 1), encoding="utf-8")

          check = Path("scripts/check.py")
          check_text = check.read_text(encoding="utf-8")
          old_check = "if project.is_file() and 'requires = [\"setuptools==83.0.0\"]' not in project.read_text(encoding=\"utf-8\"):\n        problems.append(\"build backend is not exactly pinned\")"
          new_check = "if project.is_file() and 'requires = [\"setuptools>=83.0.0,<84\"]' not in project.read_text(encoding=\"utf-8\"):\n        problems.append(\"build backend requirement is not the supported audited range\")"
          if old_check not in check_text:
              raise SystemExit("expected repository check was not found")
          check.write_text(check_text.replace(old_check, new_check, 1), encoding="utf-8")
          PY
      - name: Validate repository contracts
        run: |
          python -m compileall -q src tests scripts
          python -m unittest discover -s tests -v
          python scripts/check.py
      - name: Remove the temporary workflow and commit the normalized branch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-build-backend-range.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml scripts/check.py .github/workflows/fix-build-backend-range.yml
          git commit -m "build: use audited setuptools range with locked CI"
          git push origin "HEAD:agent/secure-setuptools-build"
