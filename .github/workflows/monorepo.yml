name: Monorepo

on: [push, pull_request]

permissions:
  contents: read

jobs:
  root-product:
    name: Root product and manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate source mapping and preserved history
        run: python scripts/check_monorepo.py
      - name: Check the root product boundary
        run: python scripts/check.py
      - name: Test the root product
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Compile root sources and tests
        run: python -m compileall -q src tests scripts

  python-packages:
    name: Package / ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package:
          - ai-software-factory
          - agent-worktrees
          - agent-handoff
          - timeout-toolkit
          - taskgraph
          - circuit-breaker-lab
          - agentmesh
          - idempotency-kit
          - agent-retry-kit
          - agent-inbox
          - agent-budgeter
          - human-in-the-loop-queue
          - context-window-budgeter
          - agent-session-recorder
          - agent-quota-simulator
    defaults:
      run:
        shell: bash
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package without runtime dependencies
        run: python -m pip install --disable-pip-version-check --no-deps .
      - name: Run package-native repository check
        run: python scripts/check.py
      - name: Run package-native tests
        run: python -m unittest discover -s tests -v
      - name: Compile package sources and tests
        run: python -m compileall -q src tests scripts

  a03-packages:
    name: A03 package / ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package:
          - apprentice-ai
          - model-router
    defaults:
      run:
        shell: bash
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package-pinned A03 toolchain
        run: python -m pip install --disable-pip-version-check --upgrade -r requirements-build-a03.txt
      - name: Run Apprentice AI candidate checks and tests
        if: matrix.package == 'apprentice-ai'
        env:
          APPRENTICE_TESTS_VERIFIED: "1"
          APPRENTICE_COUNTERPROOF_VERIFIED: "1"
        run: python scripts/a03_ci_candidate.py
      - name: Run Model Router candidate checks and tests
        if: matrix.package == 'model-router'
        env:
          MODEL_ROUTER_TESTS_VERIFIED: "1"
          MODEL_ROUTER_COUNTERPROOF_VERIFIED: "1"
        run: python scripts/a03_ci_candidate.py

  dashboard-package:
    name: Package / agent-dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/agent-dashboard
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/agent-dashboard/package-lock.json
      - name: Install locked dashboard dependencies
        run: npm ci
      - name: Lint dashboard
        run: npm run lint
      - name: Test dashboard
        run: npm test
